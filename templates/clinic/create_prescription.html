<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MediSecure | Prescription</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #eaeded;
        }

        .navbar {
            height: 64px;
            background: #131921;
            display: flex;
            align-items: center;
            padding: 0 40px;
            color: white;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #ff9900;
        }

        .container {
            max-width: 650px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #888;
            border-radius: 5px;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border: 2px solid #ff9900;
        }

        .button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 5px;
            background: #ff9900;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .button:hover {
            background: #e88b00;
        }

        .error {
            background: #ffe5e5;
            color: #b00020;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

    </style>

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Medi<span>Secure</span>
        </div>

    </nav>

    <main class="container">

        <h1>💊 Create Prescription</h1>

        <p class="subtitle">
            Prescription for {{ appointment.patient.username }}
        </p>

        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>
                    Medication
                </label>

                <input
                    type="text"
                    name="medication"
                    placeholder="Example: Paracetamol 500mg"
                    required
                >

            </div>

            <div class="form-group">

                <label>
                    Instructions
                </label>

                <textarea
                    name="instructions"
                    placeholder="Example: Take one tablet twice daily after food."
                ></textarea>

            </div>

            <button
                type="submit"
                class="button"
            >
                ✍️ Sign & Save Prescription
            </button>

        </form>

    </main>

</body>

</html>
