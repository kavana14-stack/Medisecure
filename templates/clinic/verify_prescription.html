<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediSecure | Verify Prescription</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #eaeded;
        }

        .navbar {
            height: 64px;
            background: #131921;
            display: flex;
            align-items: center;
            padding: 0 40px;
            color: white;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #ff9900;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
        }

        h1 {
            margin-bottom: 25px;
        }

        .medicine {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .instructions {
            color: #555;
            margin-bottom: 25px;
        }

        .valid {
            padding: 18px;
            background: #d4edda;
            color: #155724;
            border-radius: 6px;
            font-weight: bold;
            font-size: 18px;
        }

        .invalid {
            padding: 18px;
            background: #f8d7da;
            color: #721c24;
            border-radius: 6px;
            font-weight: bold;
            font-size: 18px;
        }

    </style>

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Medi<span>Secure</span>
        </div>

    </nav>

    <main class="container">

        <div class="card">

            <h1>🔐 Prescription Verification</h1>

            <div class="medicine">
                💊 {{ prescription.medication }}
            </div>

            <div class="instructions">
                {{ prescription.instructions }}
            </div>

            {% if is_valid %}

                <div class="valid">
                    ✅ VALID SIGNATURE<br>
                    This prescription has not been modified.
                </div>

            {% else %}

                <div class="invalid">
                    ❌ INVALID SIGNATURE<br>
                    This prescription may have been modified or forged.
                </div>

            {% endif %}

        </div>

    </main>

</body>

</html>
