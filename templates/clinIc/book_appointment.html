<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MediSecure | Book Appointment</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #eaeded;
            min-height: 100vh;
        }

        .navbar {
            height: 64px;
            background: #131921;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;

            color: white;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #ff9900;
        }

        .nav-link {
            color: white;
            text-decoration: none;
        }

        .container {
            display: flex;
            justify-content: center;

            padding: 45px 20px;
        }

        .card {
            width: 520px;

            background: white;

            border: 1px solid #ddd;

            border-radius: 8px;

            padding: 32px;

            box-shadow:
                0 3px 10px
                rgba(0, 0, 0, 0.12);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            font-weight: bold;

            margin-bottom: 7px;

            color: #111;
        }

        select,
        input,
        textarea {
            width: 100%;

            padding: 12px;

            border: 1px solid #888;

            border-radius: 5px;

            font-size: 15px;
        }

        select:focus,
        input:focus,
        textarea:focus {
            outline: none;

            border: 2px solid #ff9900;
        }

        textarea {
            resize: vertical;
        }

        .button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 5px;

            background: #ff9900;

            color: #111;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .button:hover {
            background: #e88b00;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #007eb9;

            text-decoration: none;
        }

        .errors {
            background: #ffe5e5;

            color: #b00020;

            padding: 12px;

            border-radius: 5px;

            margin-bottom: 20px;
        }

    </style>

</head>


<body>


    <nav class="navbar">

        <div class="logo">
            Medi<span>Secure</span>
        </div>

        <a
            href="{% url 'patient_dashboard' %}"
            class="nav-link"
        >
            Dashboard
        </a>

    </nav>


    <main class="container">

        <div class="card">

            <h1>
                Book Appointment
            </h1>

            <p class="subtitle">
                Schedule a consultation with a doctor.
            </p>


            {% if form.non_field_errors %}

                <div class="errors">
                    {{ form.non_field_errors }}
                </div>

            {% endif %}


            <form method="POST">

                {% csrf_token %}


                <div class="form-group">

                    <label>
                        Doctor
                    </label>

                    {{ form.doctor }}

                </div>


                <div class="form-group">

                    <label>
                        Appointment Date
                    </label>

                    {{ form.appointment_date }}

                </div>


                <div class="form-group">

                    <label>
                        Appointment Time
                    </label>

                    {{ form.appointment_time }}

                </div>


                <div class="form-group">

                    <label>
                        Reason for Visit
                    </label>

                    {{ form.reason }}

                </div>


                <button
                    type="submit"
                    class="button"
                >
                    📅 Book Appointment
                </button>

            </form>


            <a
                href="{% url 'patient_dashboard' %}"
                class="back"
            >
                ← Back to Dashboard
            </a>

        </div>

    </main>

</body>

</html>
